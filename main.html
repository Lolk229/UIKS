<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>УИКС - Навигация по университету</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="map"></div>

<!-- Кнопка-гамбургер для мобильных -->
<button id="togglePanel" class="hamburger" aria-label="Открыть меню">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Главная панель навигации -->
<div id="panel" class="panel-collapsed">

  <!-- Панель быстрого доступа -->
  <div id="quickAccess" class="quick-access">
    <h3>Быстрый доступ</h3>
    <div class="quick-buttons">
      <button class="quick-btn" data-room="Деканат" title="Деканат">
        <span class="icon">🏛️</span>
        <span class="label">Деканат</span>
      </button>
      <button class="quick-btn" data-room="Туалет" title="Туалет">
        <span class="icon">🚻</span>
        <span class="label">Туалет</span>
      </button>
      <button class="quick-btn" data-room="Столовая" title="Столовая">
        <span class="icon">🍽️</span>
        <span class="label">Столовая</span>
      </button>
      <button class="quick-btn" data-room="Библиотека" title="Библиотека">
        <span class="icon">📚</span>
        <span class="label">Библиотека</span>
      </button>
      <button class="quick-btn" data-room="S1" title="Лестница 1">
        <span class="icon">🪜</span>
        <span class="label">Лестница</span>
      </button>
    </div>
  </div>

  <!-- Разделитель -->
  <div class="divider"></div>

  <!-- Поиск маршрута -->
  <div class="route-search">
    <h3>Построить маршрут</h3>
    <div class="input-group">
      <label for="fromRoom">Откуда:</label>
      <input type="text" id="fromRoom" placeholder="Например: Б1-8" autocomplete="off" />
    </div>
    <div class="input-group">
      <label for="toRoom">Куда:</label>
      <input type="text" id="toRoom" placeholder="Например: Б2-11" autocomplete="off" />
    </div>
    <button id="findRoute" class="btn-primary">
      <span class="icon">🔍</span>
      <span>Найти путь</span>
    </button>
    <button id="clearRoute" class="btn-secondary">
      <span class="icon">✖️</span>
      <span>Очистить</span>
    </button>
  </div>

  <!-- Переключатель этажей -->
  <div id="floorSwitcher" class="floor-switcher">
    <h3>Этаж</h3>
    <div class="floor-buttons">
      <button id="floor1" class="floor-btn active">1 этаж</button>
      <button id="floor2" class="floor-btn">2 этаж</button>
      <button id="floor3" class="floor-btn">3 этаж</button>
      <button id="floor4" class="floor-btn">4 этаж</button>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/config.js"></script>
<script src="js/map-renderer.js"></script>
<script src="js/pathfinding.js"></script>
<script src="js/route-drawer.js"></script>
<script src="js/main.js"></script>

</body>
</html>
